<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>OARADHI Pac-Man</title>

    <link
        rel="stylesheet"
        href="pacman.css"
    >

</head>

<body>

    <!-- =====================================================
         PORTRAIT SCREEN
    ====================================================== -->

    <div id="rotateScreen">

        <div class="rotate-icon">
            📱↻
        </div>

        <h2>
            ROTATE YOUR PHONE
        </h2>

        <p>
            OARADHI PAC-MAN is made for landscape mode 🎮
        </p>

    </div>


    <!-- =====================================================
         MAP SELECT SCREEN
    ====================================================== -->

    <div id="mapScreen">

        <div class="map-header">

            <h1>
                OARADHI
                <span>PAC-MAN</span>
            </h1>

            <p>
                CHOOSE YOUR MAP
            </p>

        </div>


        <div id="mapOptions">

            <button
                class="map-option selected"
                data-map="OARADHI"
            >

                <canvas
                    class="preview"
                    width="310"
                    height="150"
                    data-preview="OARADHI"
                ></canvas>

                <span>
                    OARADHI
                </span>

            </button>


            <button
                class="map-option"
                data-map="RADHIRA"
            >

                <canvas
                    class="preview"
                    width="310"
                    height="150"
                    data-preview="RADHIRA"
                ></canvas>

                <span>
                    RADHIRA
                </span>

            </button>


            <button
                class="map-option"
                data-map="RUZRUN"
            >

                <canvas
                    class="preview"
                    width="310"
                    height="150"
                    data-preview="RUZRUN"
                ></canvas>

                <span>
                    RUZRUN
                </span>

            </button>


            <button
                class="map-option"
                data-map="WARUN"
            >

                <canvas
                    class="preview"
                    width="310"
                    height="150"
                    data-preview="WARUN"
                ></canvas>

                <span>
                    WARUN
                </span>

            </button>

        </div>


        <p class="select-message">
            SELECT A MAP AND PRESS PLAY
        </p>


        <button
            id="playButton"
        >
            PLAY
        </button>

    </div>


    <!-- =====================================================
         MAIN GAME
    ====================================================== -->

    <main id="game">

        <!-- TOP HUD -->

        <div class="game-hud">

            <div class="hud-left">

                <small>
                    SCORE
                </small>

                <strong id="score">
                    0
                </strong>

            </div>


            <div class="map-title">

                <span>•</span>

                <strong id="currentMap">
                    OARADHI
                </strong>

                <span>•</span>

            </div>


            <div class="hud-right">

                <small>
                    LIVES
                </small>

                <strong id="lives">
                    ❤️ ❤️ ❤️
                </strong>

            </div>

        </div>


        <!-- CANVAS -->

        <div id="gameWrapper">

            <canvas
                id="gameCanvas"
                width="930"
                height="510"
            ></canvas>

        </div>


        <!-- BOTTOM -->

        <div class="game-footer">

            <span>
                ─────
            </span>

            <p>
                USE ARROW KEYS / WASD OR SWIPE TO MOVE
            </p>

            <span>
                ─────
            </span>

        </div>


        <div class="game-buttons">

            <button id="restartButton">
                RESTART
            </button>

            <button id="mapButton">
                MAPS
            </button>

        </div>

    </main>


    <script src="pacman.js"></script>

</body>

</html>
